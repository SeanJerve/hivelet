</defs><rect x="16" y="16" width="968" height="56" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><text x="500" y="49.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">Managing a small boarding house: tenants and units, rent and expenses, repairs and inquiries</tspan></text><path d="M108.8,72 L108.8,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="16" y="106" width="185.6" height="302" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="108.8" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="108.8" dy="0">2.1.1</tspan></text><text x="108.8" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="108.8" dy="0">Fragmentation in</tspan><tspan x="108.8" dy="17">property management</tspan></text><path d="M26,174 L191.6,174" fill="none" stroke="#111" stroke-width="0.8"/><text x="24" y="190.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111"><tspan x="24" dy="0">Disconnected workflows,</tspan><tspan x="24" dy="16">inconsistent records and</tspan><tspan x="24" dy="16">delayed communication</tspan><tspan x="24" dy="16">slow the work</tspan></text><text x="24" y="266.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="24" dy="0">Burke (2026)</tspan></text><text x="24" y="283.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="24" dy="0">Magno et al. (2024)</tspan></text><text x="24" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="24" dy="0">Pavia et al. (2022)</tspan></text><text x="24" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="24" dy="0">Thevaraju et al. (2019)</tspan></text><text x="24" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="24" dy="0">Ullah et al. (2018)</tspan></text><path d="M304.4,72 L304.4,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="211.6" y="106" width="185.6" height="302" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="304.4" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="304.4" dy="0">2.1.2</tspan></text><text x="304.4" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="304.4" dy="0">Information systems as</tspan><tspan x="304.4" dy="17">the basis of</tspan><tspan x="304.4" dy="17">centralization</tspan></text><path d="M221.6,191 L387.2,191" fill="none" stroke="#111" stroke-width="0.8"/><text x="219.6" y="207.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111"><tspan x="219.6" dy="0">Inefficiency comes from</tspan><tspan x="219.6" dy="16">fragmented information</tspan><tspan x="219.6" dy="16">processing and no central</tspan><tspan x="219.6" dy="16">view of operations</tspan></text><text x="219.6" y="283.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="219.6" dy="0">Burke (2026)</tspan></text><text x="219.6" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="219.6" dy="0">Ghasemaghaei et al. (2018)</tspan></text><text x="219.6" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="219.6" dy="0">Laudon et al. (2026)</tspan></text><text x="219.6" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="219.6" dy="0">Magno et al. (2024)</tspan></text><text x="219.6" y="351.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="219.6" dy="0">Pressman and Maxim (2020)</tspan></text><path d="M500,72 L500,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="407.2" y="106" width="185.6" height="302" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="500" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">2.1.3</tspan></text><text x="500" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">Financial analytics and</tspan><tspan x="500" dy="17">decision support</tspan></text><path d="M417.2,174 L582.8,174" fill="none" stroke="#111" stroke-width="0.8"/><text x="415.2" y="190.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111"><tspan x="415.2" dy="0">Structured payment</tspan><tspan x="415.2" dy="16">records improve oversight</tspan><tspan x="415.2" dy="16">and transparency</tspan></text><text x="415.2" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="415.2" dy="0">Caparos et al. (2025)</tspan></text><text x="415.2" y="267.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="415.2" dy="0">Encarnacion et al. (2025)</tspan></text><text x="415.2" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="415.2" dy="0">Ghasemaghaei et al. (2018)</tspan></text><text x="415.2" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="415.2" dy="0">Magno et al. (2024)</tspan></text><path d="M695.5999999999999,72 L695.5999999999999,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="602.8" y="106" width="185.6" height="302" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="695.5999999999999" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="695.5999999999999" dy="0">2.1.4</tspan></text><text x="695.5999999999999" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="695.5999999999999" dy="0">Communication and</tspan><tspan x="695.5999999999999" dy="17">structured issue</tspan><tspan x="695.5999999999999" dy="17">resolution</tspan></text><path d="M612.8,191 L778.4,191" fill="none" stroke="#111" stroke-width="0.8"/><text x="610.8" y="207.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111"><tspan x="610.8" dy="0">Accountability improves</tspan><tspan x="610.8" dy="16">when requests follow a</tspan><tspan x="610.8" dy="16">structured digital</tspan><tspan x="610.8" dy="16">workflow</tspan></text><text x="610.8" y="283.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Altinay et al. (2024)</tspan></text><text x="610.8" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Canlas et al. (2026)</tspan></text><text x="610.8" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Jing and Lim (2021)</tspan></text><text x="610.8" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Mangca (2023a, 2023b)</tspan></text><text x="610.8" y="351.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Pernate et al. (2025)</tspan></text><text x="610.8" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Saputra et al. (2025)</tspan></text><text x="610.8" y="385.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="610.8" dy="0">Setty (2022)</tspan></text><path d="M891.1999999999999,72 L891.1999999999999,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="798.4" y="106" width="185.6" height="302" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="891.1999999999999" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="891.1999999999999" dy="0">2.1.5</tspan></text><text x="891.1999999999999" y="145.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="891.1999999999999" dy="0">Progressive Web</tspan><tspan x="891.1999999999999" dy="17">Applications</tspan></text><path d="M808.4,174 L974,174" fill="none" stroke="#111" stroke-width="0.8"/><text x="806.4" y="190.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111"><tspan x="806.4" dy="0">One installable web</tspan><tspan x="806.4" dy="16">application reaches</tspan><tspan x="806.4" dy="16">varied devices, and a</tspan><tspan x="806.4" dy="16">tool is taken up when it</tspan><tspan x="806.4" dy="16">fits existing practice</tspan></text><text x="806.4" y="282.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="806.4" dy="0">Anuar and Othman (2024)</tspan></text><text x="806.4" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="806.4" dy="0">Biørn-Hansen et al. (2017)</tspan></text><text x="806.4" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="806.4" dy="0">Mia et al. (2024)</tspan></text><text x="806.4" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="806.4" dy="0">Muawwal (2024)</tspan></text><path d="M108.8,408 L108.8,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M304.4,408 L304.4,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M500,408 L500,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M695.5999999999999,408 L695.5999999999999,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M891.1999999999999,408 L891.1999999999999,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M108.8,422 L891.1999999999999,422" fill="none" stroke="#111" stroke-width="1.5"/><path d="M500,422 L500,450" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="70" y="450" width="860" height="72" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="500" y="469.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">Synthesis (2.1.6)</tspan></text><text x="500" y="488.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#111"><tspan x="500" dy="0">Each study solves one part in isolation, finance, communication or tenant tracking, not all of them together. Recent</tspan><tspan x="500" dy="16">housing systems were evaluated with ISO/IEC 25010 (Canlas et al., 2026; Pernate et al., 2025).</tspan></text><path d="M500,522 L500,550" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="120" y="550" width="760" height="72" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="500" y="569.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">Gap (2.2)</tspan></text><text x="500" y="588.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#111"><tspan x="500" dy="0">No integrated system is built for a small, resource-constrained boarding house and used by both its</tspan><tspan x="500" dy="16">landlady and its tenants. Puspasari et al. (2025) serve the manager only.</tspan></text><path d="M500,622 L500,650" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="170" y="650" width="660" height="72" rx="8" fill="#fff" stroke="#111" stroke-width="2.4"/><text x="500" y="669.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="500" dy="0">This study</tspan></text><text x="500" y="688.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#111"><tspan x="500" dy="0">Hivelet: one Progressive Web Application joining tenant and unit records, financial</tspan><tspan x="500" dy="16">tracking, repair requests and inquiries, evaluated with ISO/IEC 25010.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="750" viewBox="0 0 920 750"><rect width="920" height="750" fill="#fff"/><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#111"/></marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#111"/></marker>
</defs><text x="16" y="29.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#111" font-weight="bold"><tspan x="16" dy="0">A. Rollout stages</tspan></text><rect x="16" y="44" width="160" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="96" y="64.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="96" dy="0">Stage 1</tspan></text><text x="96" y="83.6" font-family="Arial, Helvetica, sans-serif" font-size="14.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="96" dy="0">Environment</tspan><tspan x="96" dy="18">preparation</tspan></text><path d="M26,116 L166,116" fill="none" stroke="#111" stroke-width="0.8"/><text x="96" y="134.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111"><tspan x="96" dy="0">Hosting, database and</tspan><tspan x="96" dy="16">payment gateway set</tspan><tspan x="96" dy="16">up; security settings</tspan><tspan x="96" dy="16">applied</tspan></text><path d="M16,218 L176,218" fill="none" stroke="#111" stroke-width="1.2"/><text x="96" y="240.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="96" dy="0">Done</tspan></text><path d="M179,129 L197,129" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="200" y="44" width="160" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="280" y="64.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="280" dy="0">Stage 2</tspan></text><text x="280" y="83.6" font-family="Arial, Helvetica, sans-serif" font-size="14.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="280" dy="0">Record transfer</tspan></text><path d="M210,116 L350,116" fill="none" stroke="#111" stroke-width="0.8"/><text x="280" y="134.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111"><tspan x="280" dy="0">The landlady's</tspan><tspan x="280" dy="16">workbook transferred:</tspan><tspan x="280" dy="16">937 income rows and</tspan><tspan x="280" dy="16">1,327 expense</tspan><tspan x="280" dy="16">allocations</tspan></text><path d="M200,218 L360,218" fill="none" stroke="#111" stroke-width="1.2"/><text x="280" y="240.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="280" dy="0">Done</tspan></text><path d="M363,129 L381,129" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="384" y="44" width="160" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="464" y="64.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="464" dy="0">Stage 3</tspan></text><text x="464" y="83.6" font-family="Arial, Helvetica, sans-serif" font-size="14.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="464" dy="0">Pilot use</tspan></text><path d="M394,116 L534,116" fill="none" stroke="#111" stroke-width="0.8"/><text x="464" y="134.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111"><tspan x="464" dy="0">The system used</tspan><tspan x="464" dy="16">alongside the</tspan><tspan x="464" dy="16">landlady's existing</tspan><tspan x="464" dy="16">records; differences</tspan><tspan x="464" dy="16">investigated</tspan></text><path d="M384,218 L544,218" fill="none" stroke="#111" stroke-width="1.2"/><text x="464" y="240.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="464" dy="0">In progress</tspan></text><path d="M547,129 L565,129" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="568" y="44" width="160" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="648" y="64.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="648" dy="0">Stage 4</tspan></text><text x="648" y="83.6" font-family="Arial, Helvetica, sans-serif" font-size="14.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="648" dy="0">Training and</tspan><tspan x="648" dy="18">hand-over</tspan></text><path d="M578,116 L718,116" fill="none" stroke="#111" stroke-width="0.8"/><text x="648" y="134.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111"><tspan x="648" dy="0">Landlady and tenants</tspan><tspan x="648" dy="16">shown the system;</tspan><tspan x="648" dy="16">user manual (Appendix</tspan><tspan x="648" dy="16">K) handed over;</tspan><tspan x="648" dy="16">accounts issued</tspan></text><path d="M568,218 L728,218" fill="none" stroke="#111" stroke-width="1.2"/><text x="648" y="240.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="648" dy="0">Done</tspan></text><path d="M731,129 L749,129" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="752" y="44" width="160" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="7 5"/><text x="832" y="64.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="832" dy="0">Stage 5</tspan></text><text x="832" y="83.6" font-family="Arial, Helvetica, sans-serif" font-size="14.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="832" dy="0">Full transition</tspan></text><path d="M762,116 L902,116" fill="none" stroke="#111" stroke-width="0.8"/><text x="832" y="134.4" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111"><tspan x="832" dy="0">The system becomes</tspan><tspan x="832" dy="16">the landlady's main</tspan><tspan x="832" dy="16">record once both</tspan><tspan x="832" dy="16">records agree</tspan></text><path d="M752,218 L912,218" fill="none" stroke="#111" stroke-width="1.2"/><text x="832" y="240.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="832" dy="0">Not yet</tspan></text><text x="460" y="272.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="460" dy="0">Pilot use continues until the system and the landlady's own records agree; only then does stage 5 begin. A dashed box is a stage</tspan><tspan x="460" dy="16">not yet started.</tspan></text><text x="16" y="333.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#111" font-weight="bold"><tspan x="16" dy="0">B. How a change reaches the live system</tspan></text><rect x="16" y="342" width="188" height="112" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="110" y="368.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111"><tspan x="110" dy="0">Researchers' computer:</tspan><tspan x="110" dy="17">a change made and</tspan><tspan x="110" dy="17">checked; a check for</tspan><tspan x="110" dy="17">credentials runs before</tspan><tspan x="110" dy="17">every commit</tspan></text><rect x="250" y="362" width="160" height="72" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="330" y="394.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="330" dy="0">GitHub: the main</tspan><tspan x="330" dy="18">code branch</tspan></text><rect x="455" y="334" width="210" height="128" rx="10" fill="#fff" stroke="#111" stroke-width="1.4" stroke-dasharray="7 5"/><text x="560" y="359.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="560" dy="0">Vercel (hosting)</tspan></text><rect x="465" y="373" width="190" height="74" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="560" y="397.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111"><tspan x="560" dy="0">Deployed automatically:</tspan><tspan x="560" dy="17">the built app and the</tspan><tspan x="560" dy="17">Express API</tspan></text><rect x="720" y="352" width="184" height="92" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="812" y="376.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="812" dy="0">Landlady, tenants and</tspan><tspan x="812" dy="18">visitors in a</tspan><tspan x="812" dy="18">browser, at</tspan><tspan x="812" dy="18">hivelet.vercel.app</tspan></text><path d="M204,398 L250,398" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M410,398 L455,398" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><text x="432" y="388.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#555"><tspan x="432" dy="0">push</tspan></text><path d="M665,398 L720,398" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="692" y="388.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#555"><tspan x="692" dy="0">HTTPS</tspan></text><rect x="16" y="516" width="188" height="64" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="110" y="544.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="110" dy="0">Backup taken before</tspan><tspan x="110" dy="18">any change to the data</tspan></text><rect x="240" y="506" width="180" height="84" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="330" y="526.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="330" dy="0">Numbered migration,</tspan><tspan x="330" dy="18">reviewed before it</tspan><tspan x="330" dy="18">runs, result read</tspan><tspan x="330" dy="18">back</tspan></text><rect x="465" y="516" width="190" height="64" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="560" y="535.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="560" dy="0">Supabase: PostgreSQL</tspan><tspan x="560" dy="18">database (live</tspan><tspan x="560" dy="18">records)</tspan></text><rect x="720" y="506" width="184" height="84" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="812" y="526.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="812" dy="0">Adyen with GCash:</tspan><tspan x="812" dy="18">test environment,</tspan><tspan x="812" dy="18">optional, takes no</tspan><tspan x="812" dy="18">real money</tspan></text><path d="M110,444 L110,516" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><text x="116" y="484.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="116" dy="0">data changes</tspan></text><path d="M204,548 L240,548" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M420,548 L465,548" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M560,447 L560,516" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="566" y="485.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="566" dy="0">queries</tspan></text><path d="M655,434 L695,434 L695,548 L720,548" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="703" y="470.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#555"><tspan x="703" dy="0">payment session and signed</tspan><tspan x="703" dy="15">notice</tspan></text><text x="16" y="633.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#111" font-weight="bold"><tspan x="16" dy="0">C. Turnover</tspan></text><rect x="16" y="650" width="308" height="84" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="170" y="679.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="170" dy="0">Until turnover: the hosting, database</tspan><tspan x="170" dy="18">and payment gateway accounts are held</tspan><tspan x="170" dy="18">by the research team</tspan></text><rect x="395" y="650" width="320" height="84" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="555" y="679.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="555" dy="0">At turnover: the accounts pass to the</tspan><tspan x="555" dy="18">landlady, with the team member who is</tspan><tspan x="555" dy="18">her son and knows the system</tspan></text><rect x="740" y="650" width="164" height="84" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="822" y="672.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#111"><tspan x="822" dy="0">Support for an agreed</tspan><tspan x="822" dy="16">period, under the</tspan><tspan x="822" dy="16">memorandum of</tspan><tspan x="822" dy="16">agreement</tspan></text><path d="M324,692 L395,692" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><path d="M715,692 L740,692" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/></svg>
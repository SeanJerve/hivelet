</defs><rect x="16" y="16" width="230" height="560" rx="10" fill="#fff" stroke="#111" stroke-width="1.4" stroke-dasharray="7 5"/><text x="131" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="131" dy="0">Client device</tspan></text><text x="131" y="64.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555"><tspan x="131" dy="0">A phone or computer browser,</tspan><tspan x="131" dy="16">used by visitors, tenants and</tspan><tspan x="131" dy="16">the owner</tspan></text><rect x="33" y="138" width="196" height="96" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="131" y="164.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="131" dy="0">Hivelet web app (Vue 3,</tspan><tspan x="131" dy="18">TypeScript),</tspan><tspan x="131" dy="18">installable as a</tspan><tspan x="131" dy="18">Progressive Web App</tspan></text><rect x="33" y="281" width="196" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="131" y="303.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="131" dy="0">Service worker: keeps</tspan><tspan x="131" dy="18">the app's files so it</tspan><tspan x="131" dy="18">opens offline</tspan></text><rect x="33" y="435" width="196" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="131" y="466.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="131" dy="0">Adyen Drop-in: the</tspan><tspan x="131" dy="18">GCash payment form</tspan></text><path d="M131,234 L131,281" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><rect x="356" y="16" width="270" height="560" rx="10" fill="#fff" stroke="#111" stroke-width="1.4" stroke-dasharray="7 5"/><text x="491" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="491" dy="0">Vercel (hosting)</tspan></text><rect x="376" y="79" width="230" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="491" y="106.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="491" dy="0">Static site: the built app</tspan><tspan x="491" dy="18">files</tspan></text><rect x="376" y="200" width="230" height="356" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="491" y="222.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="491" dy="0">Serverless function:</tspan><tspan x="491" dy="18">Express API at /api</tspan></text><circle cx="392" cy="275" r="2.6" fill="#111"/><text x="402" y="275.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">Sign-in with signed</tspan><tspan x="402" dy="17">tokens (JWT); passwords</tspan><tspan x="402" dy="17">hashed with bcrypt</tspan></text><circle cx="392" cy="340" r="2.6" fill="#111"/><text x="402" y="340.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">Role checked on every</tspan><tspan x="402" dy="17">request</tspan></text><circle cx="392" cy="388" r="2.6" fill="#111"/><text x="402" y="388.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">Every input validated</tspan><tspan x="402" dy="17">(zod)</tspan></text><circle cx="392" cy="436" r="2.6" fill="#111"/><text x="402" y="436.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">Business rules and</tspan><tspan x="402" dy="17">computed figures</tspan></text><circle cx="392" cy="484" r="2.6" fill="#111"/><text x="402" y="484.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">An audit record of every</tspan><tspan x="402" dy="17">change</tspan></text><circle cx="392" cy="532" r="2.6" fill="#111"/><text x="402" y="532.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111"><tspan x="402" dy="0">Workbook downloads</tspan><tspan x="402" dy="17">(ExcelJS)</tspan></text><rect x="700" y="16" width="184" height="300" rx="10" fill="#fff" stroke="#111" stroke-width="1.4" stroke-dasharray="7 5"/><text x="792" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="792" dy="0">Supabase</tspan></text><rect x="717" y="79" width="150" height="66" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="792" y="108.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="792" dy="0">PostgreSQL 17.6</tspan><tspan x="792" dy="18">database</tspan></text><text x="792" y="194.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555"><tspan x="792" dy="0">Row-level security on</tspan><tspan x="792" dy="16">every table; read and</tspan><tspan x="792" dy="16">written only by the</tspan><tspan x="792" dy="16">API, with a key kept</tspan><tspan x="792" dy="16">on the server</tspan></text><rect x="708" y="369" width="168" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="792" y="396.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="792" dy="0">Adyen payment</tspan><tspan x="792" dy="18">gateway</tspan></text><rect x="784" y="498" width="96" height="44" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="832" y="525.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="832" dy="0">GCash</tspan></text><path d="M832,431 L832,498" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><path d="M229,160 L376,110" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="296" y="112.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555"><tspan x="296" dy="0">App files</tspan></text><path d="M229,200 L300,200 L300,300 L376,300" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="301" y="324.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555"><tspan x="301" dy="0">Requests and</tspan><tspan x="301" dy="16">answers over</tspan><tspan x="301" dy="16">HTTPS, with</tspan><tspan x="301" dy="16">the sign-in</tspan><tspan x="301" dy="16">token</tspan></text><path d="M606,250 L650,250 L650,112 L717,112" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="642" y="185.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555" transform="rotate(-90 642 181)"><tspan x="642" dy="0">Queries</tspan></text><path d="M606,388 L708,388" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><text x="660" y="356.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="660" dy="0">Payment</tspan><tspan x="660" dy="16">session</tspan></text><path d="M708,414 L606,414" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><text x="660" y="436.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555"><tspan x="660" dy="0">Signed</tspan><tspan x="660" dy="16">result</tspan><tspan x="660" dy="16">notice</tspan></text><path d="M131,505 L131,610 L740,610 L740,431" fill="none" stroke="#111" stroke-width="1.5" marker-start="url(#arrS)" marker-end="url(#arr)"/><text x="420" y="632.7" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#555"><tspan x="420" dy="0">Payment details go from the form to Adyen directly, never through the API</tspan></text></svg>
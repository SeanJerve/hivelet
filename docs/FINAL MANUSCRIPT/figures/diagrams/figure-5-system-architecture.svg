    <path d="M0,0.5 L10,5 L0,9.5 Z" fill="#111"/></marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">

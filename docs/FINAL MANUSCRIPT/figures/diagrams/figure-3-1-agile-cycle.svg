</defs><rect x="160" y="630" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="300" y="657.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="300" dy="0">1  Requirements</tspan></text><text x="176" y="684.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="176" dy="0">•</tspan></text><text x="190" y="684.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="190" dy="0">Conducting interviews and</tspan><tspan x="190" dy="16">identifying the system</tspan><tspan x="190" dy="16">requirements</tspan></text><text x="176" y="739.3" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="176" dy="0">•</tspan></text><text x="190" y="739.3" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="190" dy="0">Considering resources, cost, and</tspan><tspan x="190" dy="16">time</tspan></text><rect x="660" y="630" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="800" y="657.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="800" dy="0">2  Design</tspan></text><text x="676" y="684.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="676" dy="0">•</tspan></text><text x="690" y="684.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="690" dy="0">Identifying each problem and the</tspan><tspan x="690" dy="16">solution that best fits it</tspan></text><text x="676" y="722.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="676" dy="0">•</tspan></text><text x="690" y="722.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="690" dy="0">Analyzing the end users' and the</tspan><tspan x="690" dy="16">client's needs</tspan></text><text x="676" y="760.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="676" dy="0">•</tspan></text><text x="690" y="760.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="690" dy="0">Describing specifications,</tspan><tspan x="690" dy="16">features, and processes</tspan></text><rect x="810" y="355" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="950" y="382.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="950" dy="0">3  Development</tspan></text><text x="826" y="409.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="826" dy="0">•</tspan></text><text x="840" y="409.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="840" dy="0">Organizing processes with</tspan><tspan x="840" dy="16">flowcharts</tspan></text><text x="826" y="447.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="826" dy="0">•</tspan></text><text x="840" y="447.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="840" dy="0">Developing and structuring the</tspan><tspan x="840" dy="16">system</tspan></text><rect x="660" y="80" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="800" y="107.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="800" dy="0">4  Testing</tspan></text><text x="676" y="134.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="676" dy="0">•</tspan></text><text x="690" y="134.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="690" dy="0">Determining whether the system</tspan><tspan x="690" dy="16">meets end-user requirements</tspan></text><text x="676" y="172.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="676" dy="0">•</tspan></text><text x="690" y="172.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="690" dy="0">Identifying bugs, errors, and</tspan><tspan x="690" dy="16">other issues</tspan></text><rect x="160" y="80" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="300" y="107.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="300" dy="0">5  Deployment</tspan></text><text x="176" y="134.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="176" dy="0">•</tspan></text><text x="190" y="134.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="190" dy="0">Installing and rolling out the</tspan><tspan x="190" dy="16">system</tspan></text><text x="176" y="172.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="176" dy="0">•</tspan></text><text x="190" y="172.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="190" dy="0">Deploying each increment to the</tspan><tspan x="190" dy="16">target environment</tspan></text><rect x="10" y="355" width="280" height="170" rx="14" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="150" y="382.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="150" dy="0">6  Review and Maintenance</tspan></text><text x="26" y="409.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="26" dy="0">•</tspan></text><text x="40" y="409.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="40" dy="0">Gathering stakeholder and user</tspan><tspan x="40" dy="16">feedback</tspan></text><text x="26" y="447.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="26" dy="0">•</tspan></text><text x="40" y="447.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="40" dy="0">Improving performance through</tspan><tspan x="40" dy="16">incremental updates</tspan></text><text x="26" y="485.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="26" dy="0">•</tspan></text><text x="40" y="485.8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#111"><tspan x="40" dy="0">Planning and checking the next</tspan><tspan x="40" dy="16">iteration</tspan></text><circle cx="550" cy="440" r="80" fill="#fff" stroke="#111" stroke-width="2"/><text x="550" y="448.4" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="550" dy="0">AGILE</tspan></text><path d="M440,715 L660,715" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/><path d="M900,630 L925,525" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/><path d="M925,355 L900,250" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/><path d="M660,165 L440,165" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/><path d="M200,250 L175,355" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/><path d="M175,525 L200,630" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/></svg>
</defs><rect x="1" y="1" width="898" height="757" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M1,44 L899,44" fill="none" stroke="#111" stroke-width="1.2"/><text x="56" y="116.4" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="56" dy="0">Tenant or</tspan><tspan x="56" dy="17">prospect</tspan></text><path d="M1,196 L899,196" fill="none" stroke="#111" stroke-width="1.2"/><text x="56" y="345.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="56" dy="0">Owner</tspan></text><path d="M1,486 L899,486" fill="none" stroke="#111" stroke-width="1.2"/><text x="56" y="565.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="56" dy="0">Records kept</tspan></text><path d="M1,636 L899,636" fill="none" stroke="#111" stroke-width="1.2"/><text x="56" y="684.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="56" dy="0">Problem</tspan><tspan x="56" dy="17">identified</tspan><tspan x="56" dy="17">(Table 5)</tspan></text><path d="M112,1 L112,758" fill="none" stroke="#111" stroke-width="1.2"/><path d="M309,1 L309,758" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/><path d="M506,1 L506,758" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/><path d="M703,1 L703,758" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/><text x="210.5" y="28.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="210.5" dy="0">Rent collection</tspan></text><text x="407.5" y="28.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="407.5" dy="0">Expenses</tspan></text><text x="604.5" y="28.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="604.5" dy="0">Repair requests</tspan></text><text x="801.5" y="28.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="801.5" dy="0">Enquiries</tspan></text><rect x="127.5" y="87" width="166" height="62" rx="31" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="210.5" y="114.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="210.5" dy="0">Tenant pays rent in</tspan><tspan x="210.5" dy="18">cash on site</tspan></text><rect x="127.5" y="231" width="166" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="210.5" y="249.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="210.5" dy="0">Owner writes an</tspan><tspan x="210.5" dy="18">invoice in the</tspan><tspan x="210.5" dy="18">paper invoice book</tspan></text><rect x="127.5" y="348" width="166" height="96" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="210.5" y="365.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="210.5" dy="0">Owner types the</tspan><tspan x="210.5" dy="18">payment into the</tspan><tspan x="210.5" dy="18">Monthly Income</tspan><tspan x="210.5" dy="18">Report and adds the</tspan><tspan x="210.5" dy="18">totals by hand</tspan></text><path d="M210.5,149 L210.5,231" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M210.5,293 L210.5,348" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M135.5,515 H285.5 V573 C248,561 225.5,587 210.5,577 C188,567 165.5,587 135.5,575 Z" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="210.5" y="540.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="210.5" dy="0">Invoice book</tspan><tspan x="210.5" dy="18">(paper)</tspan></text><path d="M127.5,262 L120,262 L120,548 L135.5,548" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="324.5" y="231" width="166" height="62" rx="31" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="407.5" y="258.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="407.5" dy="0">Owner pays a</tspan><tspan x="407.5" dy="18">supplier</tspan></text><rect x="324.5" y="338" width="166" height="124" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="407.5" y="360.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="407.5" dy="0">Owner types the</tspan><tspan x="407.5" dy="18">expense into the</tspan><tspan x="407.5" dy="18">Monthly Expenses</tspan><tspan x="407.5" dy="18">Report and splits</tspan><tspan x="407.5" dy="18">it across property</tspan><tspan x="407.5" dy="18">areas by hand</tspan></text><path d="M407.5,293 L407.5,338" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M321.5,508 H493.5 V588 C450.5,576 424.7,602 407.5,592 C381.7,582 355.9,602 321.5,590 Z" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="407.5" y="535.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="407.5" dy="0">Workbook on</tspan><tspan x="407.5" dy="18">removable storage,</tspan><tspan x="407.5" dy="18">the only copy</tspan></text><path d="M210.5,444 L210.5,474 L357.5,474 L357.5,508" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><path d="M407.5,462 L407.5,508" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="521.5" y="79" width="166" height="78" rx="39" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="604.5" y="105.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="604.5" dy="0">Tenant reports a</tspan><tspan x="604.5" dy="18">problem by message</tspan><tspan x="604.5" dy="18">or in person</tspan></text><rect x="521.5" y="269" width="166" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="604.5" y="296.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="604.5" dy="0">Owner arranges the</tspan><tspan x="604.5" dy="18">repair</tspan></text><path d="M604.5,157 L604.5,269" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="534.5" y="535" width="140" height="50" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 5"/><text x="604.5" y="565.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-style="italic"><tspan x="604.5" dy="0">No record</tspan></text><path d="M604.5,331 L604.5,535" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="718.5" y="87" width="166" height="62" rx="31" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="801.5" y="114.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="801.5" dy="0">Prospect asks about</tspan><tspan x="801.5" dy="18">a unit</tspan></text><rect x="718.5" y="269" width="166" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="801.5" y="296.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111"><tspan x="801.5" dy="0">Owner answers the</tspan><tspan x="801.5" dy="18">prospect</tspan></text><path d="M801.5,149 L801.5,269" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/><rect x="731.5" y="535" width="140" height="50" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 5"/><text x="801.5" y="565.3" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-style="italic"><tspan x="801.5" dy="0">No record</tspan></text><path d="M801.5,331 L801.5,535" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="210.5" y="677.4" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-style="italic"><tspan x="210.5" dy="0">Nothing checks an</tspan><tspan x="210.5" dy="17">invoice number against</tspan><tspan x="210.5" dy="17">the book; totals depend</tspan><tspan x="210.5" dy="17">on hand arithmetic</tspan></text><text x="407.5" y="677.4" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-style="italic"><tspan x="407.5" dy="0">Totals depend on hand</tspan><tspan x="407.5" dy="17">arithmetic; one file on</tspan><tspan x="407.5" dy="17">removable storage is the</tspan><tspan x="407.5" dy="17">only copy</tspan></text><text x="604.5" y="685.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-style="italic"><tspan x="604.5" dy="0">Requests are not</tspan><tspan x="604.5" dy="17">recorded, so none can be</tspan><tspan x="604.5" dy="17">followed to completion</tspan></text><text x="801.5" y="685.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-style="italic"><tspan x="801.5" dy="0">No record of an enquiry</tspan><tspan x="801.5" dy="17">or of the unit it was</tspan><tspan x="801.5" dy="17">about</tspan></text></svg>
<text x="48" y="2470" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#173C3B">A–B isolates the combined surrounding treatment. A–C isolates drawing. B–C changes both.</text><text x="48" y="2514" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#173C3B">Candidates for judgment, not a ranking. Fewer elements, ellipses or orange are not inherently better or worse.</text></svg>
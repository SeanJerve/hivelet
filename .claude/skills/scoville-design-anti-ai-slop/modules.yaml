# Non-routed packaging/evaluation metadata; not an installed runtime dependency.
# Repository tooling generates SKILL.md's direct index from route_label/path;
# generate_module_index.py --check and validate_package.py detect index drift.
# Those authoring tools are not shipped or required for ordinary installed use.
# evidence values identify external development receipts, not included files.
# Empty = none referenced; nonempty does not imply pass or current qualification.
# SKILL.md owns runtime routing, including decision-level exclusions. Signals
# below are declared inputs after that interpretation, not a keyword router.
# Empty unless/requires/conflicts lists do not remove the Core's exclusions or
# introduce automatic expert dependencies.
# Status records development evidence, not document length or runtime priority.
# Intervention describes the intended evaluation mechanism: focus = attention;
# correction = remedy an error; teaching = add knowledge; external-verification
# = obtain proof outside generation. These labels do not prove effectiveness.


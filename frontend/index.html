<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!--
      iOS Safari's "Add to Home Screen" reads this tag directly - it does not
      consult the Web App Manifest's icons array the way Android/Chrome does
      - and it does not accept SVG here. An SVG `apple-touch-icon` is silently
      ignored, which is why this pointed at `favicon.svg` with no visible
      symptom until someone actually tried adding the app to an iPhone home
      screen. 180x180 is Apple's own recommended size (the largest current
      iPhone home-screen icon); `apple-touch-icon.png` is rasterized from
      `favicon.svg`, same artwork as the manifest's own `icon-*.png` entries
      (see vite.config.ts).
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Kept in sync with `theme_color` in vite.config.ts's VitePWA manifest - see the comment there for why this is `--brand` (#17603f), not the `--primary` blue it used to be. -->
    <meta name="theme-color" content="#17603f">
    <!--
      Written for the person who finds or is sent the public site, since that
      is who a search result or a shared link reaches: the old description
      ("centralized apartment operations ... financial analytics") described
      the admin side, which nobody arriving from a search can open. The
      Open Graph tags give a link pasted into Messenger or Facebook a real
      title, summary and photograph instead of the bare URL. `og:image` needs
      an absolute URL, which needed the production domain (B-62 item 3);
      the site went live on Vercel at hivelet.vercel.app on 2026-09-24
      (B-66), so it is filled in now. The picture is og-image.jpg, 1200x630 as
      Facebook and Messenger crop it: the Hivelet mark, the property's name and
      the building photo, rendered by video/capture/render-app-icons.mjs. JPEG
      on purpose, so the service worker's `**/*.png` precache never downloads
      it for every visitor.
    -->
    <meta name="description" content="Rooms for rent at Fe Galang Da Silva Boarding House, 32 Sapaguita Street, Brgy. 4 Sagpon Old Albay, Legazpi City. See the units and their rates, and send an inquiry to arrange a viewing.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hivelet">
    <meta property="og:title" content="Fe Galang Da Silva Boarding House, Legazpi City">
    <meta property="og:description" content="See the units and their rates, and send an inquiry to arrange a viewing.">
    <meta property="og:url" content="https://hivelet.vercel.app/public">
    <meta property="og:image" content="https://hivelet.vercel.app/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Hivelet mark beside the front of the Fe Galang Da Silva Boarding House">
    <meta property="og:locale" content="en_PH">
    <meta name="twitter:card" content="summary_large_image">
    <!-- main.ts keeps these two current per page: noindex behind a sign-in, and each page's own canonical address. -->
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://hivelet.vercel.app/public">
    <meta name="apple-mobile-web-app-title" content="Hivelet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dark mode before the first paint, the loader included (public/theme-init.js; Sean, 2026-10-01). After the theme-color meta, which it rewrites. -->
    <script src="/theme-init.js"></script>
    <title>Hivelet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Sora carries 300 and 500 because the pages actually ask for them: the
      public pages use `font-light` and `font-medium` throughout, and the
      workspace sets every heading in `font-medium`. The request was
      `400;600;700;800`, so both collapsed to 400 and a deliberate light/medium
      distinction rendered as one weight.

      Inter was dropped on 19 Sep. It was requested for `--font-editorial`, the
      public pages' typeface; that token now resolves to the same stack as
      `--font-display`, so nothing referenced Inter any more and every visitor
      was still downloading it.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!--
      Loader for the first load and every full reload, pull-to-refresh included
      (Sean, 2026-10-01: "it just waits, then boom, the site appears"; "on
      refresh the website just goes white and you see the headers"). The
      hexagon of the Hivelet mark, in brand green with the mark's own rounded
      corners and round joins, turns slowly, speeding up and slowing down each
      turn (--ease-in-out); the house and H inside it stay still. It covers the
      whole screen, opaque, so neither the white page nor the header drawn over
      an empty page ever shows.

      Plain HTML and CSS in this file, because it has to be on screen before any
      script has arrived - and because vercel.json's Content-Security-Policy is
      `script-src 'self'`, which blocks an inline script anyway. main.ts fades it
      out over 200ms and removes it once the first page has rendered.

      Colours are the brand tokens written out (src/index.css has not loaded yet):
      `--brand` #17603f and `--background` #fafaf9, which is also the manifest's
      `background_color`, so the installed app's own launch screen hands over to
      this one with no change of colour. There is no dark variant on purpose: the
      app has no dark theme, so a dark loader would flash dark-then-light on
      every load in dark mode - exactly the jump this is here to remove.

      Never in the way:
        - the mark is painted at full opacity from the first frame. It used to
          fade in after 120ms, so a fast load would not show it, but Chrome does
          not count opacity-0 content as a first contentful paint: Lighthouse
          mobile FCP went from 1.95s to 2.50s with the fade-in, and to 1.7s
          without it (same build, 4 runs each, 2026-10-01);
        - main.ts takes it down at 8s whatever the page is doing, and if
          main.ts never runs (a failed download) the `splash-giveup` animation
          hides it by itself at 8s instead of leaving it up;
        - reduced motion: the hexagon breathes in place instead of turning.
    -->
    <style>
      #app-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#fafaf9;transition:opacity .2s cubic-bezier(.23,1,.32,1);animation:splash-giveup .2s 8s forwards}
      #app-splash.is-leaving{opacity:0;pointer-events:none}
      [data-theme="dark"] #app-splash{background:#0f1412}
      #app-splash svg{width:72px;height:72px;overflow:visible}
      #app-splash .hex{transform-origin:256px 256px;animation:splash-spin 1.8s cubic-bezier(.77,0,.175,1) infinite}
      #app-splash .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @keyframes splash-giveup{to{opacity:0;visibility:hidden}}
      @keyframes splash-breathe{50%{opacity:.7}}
      @media (prefers-reduced-motion:reduce){#app-splash .hex{animation:splash-breathe 2.4s ease-in-out infinite}}
    </style>
  </head>
  <body class="bg-[#fafaf9] text-[#1c1917] antialiased selection:bg-[#f59e0b]/20 selection:text-[#1c1917]">
    <div id="app"></div>
    <!-- Outside #app: Vue empties #app on mount, which would cut the loader off without its fade. -->
    <div id="app-splash" role="status">
      <!-- The app icon itself (public/favicon.svg): a solid green hexagon that turns, the white
           house and H still on top of it (Sean, 2026-10-01: "filled in green, the icon white,
           the hexagon spinning but the icon inside is not"). -->
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <path class="hex" fill="#17603f" d="M217.89 34Q256 12 294.11 34L429.21 112Q467.31 134 467.31 178L467.31 334Q467.31 378 429.21 400L294.11 478Q256 500 217.89 478L82.79 400Q44.69 378 44.69 334L44.69 178Q44.69 134 82.79 112Z"/>
        <path fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M146 216L256 126L366 216M186 244V366M326 244V366M186 304H326"/>
      </svg>
      <span class="sr">Loading Hivelet</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

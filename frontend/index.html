<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!--
      iOS Safari's "Add to Home Screen" reads this tag directly - it does not
      consult the Web App Manifest's icons array the way Android/Chrome does
      - and it does not accept SVG here. An SVG `apple-touch-icon` is silently
      ignored, which is why this pointed at `favicon.svg` with no visible
      symptom until someone actually tried adding the app to an iPhone home
      screen. 180x180 is Apple's own recommended size (the largest current
      iPhone home-screen icon); `apple-touch-icon.png` is rasterized from
      `favicon.svg`, same artwork as the manifest's own `icon-*.png` entries
      (see vite.config.ts).
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Kept in sync with `theme_color` in vite.config.ts's VitePWA manifest - see the comment there for why this is `--brand` (#17603f), not the `--primary` blue it used to be. -->
    <meta name="theme-color" content="#17603f">
    <!--
      Written for the person who finds or is sent the public site, since that
      is who a search result or a shared link reaches: the old description
      ("centralized apartment operations ... financial analytics") described
      the admin side, which nobody arriving from a search can open. The
      Open Graph tags give a link pasted into Messenger or Facebook a real
      title, summary and photograph instead of the bare URL. `og:image` needs
      an absolute URL, which needed the production domain (B-62 item 3);
      the site went live on Vercel at hivelet.vercel.app on 2026-09-24
      (B-66), so it is filled in now. Same photograph as the landing hero,
      same intrinsic size (vite.config.ts's PWA precache comment).
    -->
    <meta name="description" content="Rooms for rent at Fe Galang Da Silva Boarding House, 32 Sapaguita Street, Brgy. 4 Sagpon Old Albay, Legazpi City. See the units and their rates, and register your interest for a viewing.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hivelet">
    <meta property="og:title" content="Fe Galang Da Silva Boarding House, Legazpi City">
    <meta property="og:description" content="See the units and their rates, and register your interest for a viewing.">
    <meta property="og:url" content="https://hivelet.vercel.app/public">
    <meta property="og:image" content="https://hivelet.vercel.app/fe-galang-building.webp">
    <meta property="og:image:width" content="1790">
    <meta property="og:image:height" content="879">
    <meta property="og:locale" content="en_PH">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="apple-mobile-web-app-title" content="Hivelet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hivelet — Apartment Management & Resident Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Sora carries 300 and 500 because the pages actually ask for them: the
      public pages use `font-light` and `font-medium` throughout, and the
      workspace sets every heading in `font-medium`. The request was
      `400;600;700;800`, so both collapsed to 400 and a deliberate light/medium
      distinction rendered as one weight.

      Inter was dropped on 19 Sep. It was requested for `--font-editorial`, the
      public pages' typeface; that token now resolves to the same stack as
      `--font-display`, so nothing referenced Inter any more and every visitor
      was still downloading it.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fafaf9] text-[#1c1917] antialiased selection:bg-[#f59e0b]/20 selection:text-[#1c1917]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

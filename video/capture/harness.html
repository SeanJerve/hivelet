<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hivelet video capture harness</title>
  <!-- The same fonts frontend/index.html loads. Without them every heading
       falls back to the system font and the screens are not the real ones. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

       frame. A phone or a Mac shows none, so neither does the film. -->
  <style>html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }</style>
</head>

//
// capture.mjs copies this file to frontend/_harness-video.html (gitignored)
// for the length of a capture and deletes it afterwards.

const incomeRecords = [];

    if (code === VACANT) continue;
    if (month === 9 && UNPAID_SEPT.has(code)) continue;
    const [name, occ, day] = PEOPLE[code];
    const paidDay = Math.min(28, Math.max(1, day - (code.charCodeAt(0) % 3)));
    const water = WATER * occ;
    const linda = cluster === 'Linda';
    const gbg = linda ? 0 : GBG;
    const gcash = month >= 7 && ['1a', '2b', '3e', 'F2B', 'PH', '2e'].includes(code);
    const endMonth = month === 12 ? 1 : month + 1;
    incomeRecords.push({
      id: `inc-${code.toLowerCase()}-${month}`, room_id: roomId(code), rooms: { room_number: code, cluster_code: cluster },
      date_paid: ymd(2026, month, paidDay), rent_period_start: ymd(2026, month, day), rent_period_end: ymd(2026, endMonth, Math.max(1, day - 1)),

];
const expenseEntries = [];
for (let month = 1; month <= 9; month++) {
  EXPENSE_PATTERN.forEach(([code, supplier, base, alloc, day], k) => {
    if (code === '8' && month % 2 === 0) return;
    const f = 1 + ((month * 7 + k * 3) % 9) / 100;
    const total = Math.round(base * f);
    const scale = total / base;
    const allocations = alloc.map(([area, amount], j) => ({ id: `alloc-${month}-${k}-${j}`, property_area: area, amount: j === alloc.length - 1 ? total - alloc.slice(0, -1).reduce((s, [, a]) => s + Math.round(a * scale), 0) : Math.round(amount * scale) }));
    expenseEntries.push({ id: `exp-${month}-${k}`, expense_date: ymd(2026, month, day), or_supplier: supplier, category_code: code, fixed_expense_categories: { name: catName(code) }, total_expenses: total, expense_property_allocations: allocations });
  });
}
expenseEntries.push({ id: 'exp-tax', expense_date: ymd(2026, 3, 28), or_supplier: 'City treasurer', category_code: '2', fixed_expense_categories: { name: catName('2') }, total_expenses: 14500, expense_property_allocations: [{ id: 'alloc-tax', property_area: 'Boarding House', amount: 14500 }] });

  { id: 'tk-3', room_id: roomId('B2F'), rooms: { room_number: 'B2F' }, title: 'Closet door off its track', category: 'Structural / Furniture', priority: 'Low', status: 'In Progress', created_at: daysAgo(4), description: 'The sliding closet door came off its track.', assigned_technician: 'Carpenter', ticket_attachments: [], profiles: { full_name: 'Antonio Brizuela' }, tenant_profile_id: tenantId('B2F') },

// ---- The fake API --------------------------------------------------------------
const publicRooms = rooms.map(({ room_assignments, ...r }) => r);

const unread = (list) => list.filter((n) => !n.is_read).length;

const ROUTES = [
  ['GET', /^\/public\/rates$/, () => ok(rates)],
  ['GET', /^\/public\/rooms$/, () => ok(publicRooms)],

  ['GET', /^\/tenant\/my-rooms$/, () => ok(tenant.rooms)],

  ['GET', /^\/tenant\/my-payments$/, () => ok(tenant.payments)],
  ['GET', /^\/tenant\/my-income-records$/, () => ok(tenantIncome)],
  ['GET', /^\/tenant\/my-standing$/, () => ok(tenant.standing)],
  ['GET', /^\/tenant\/my-profile$/, () => ok(tenant.profile)],
  ['GET', /^\/tenant\/my-tickets$/, () => ok(tenant.tickets)],
  ['GET', /^\/tenant\/tickets\/[^/]+\/messages$/, () => ok([])],
  ['GET', /^\/tenant\/my-notifications\/unread-count$/, () => ok({ unreadCount: unread(tenant.notifications) })],
  ['GET', /^\/tenant\/my-notifications$/, () => ok(tenant.notifications, { totalUnread: unread(tenant.notifications) })],
];

const realFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  if (!url.includes('/api/')) return realFetch(input, init);
  const path = url.split('/api')[1].split('?')[0];
  const method = ((init && init.method) || 'GET').toUpperCase();
  if (path === '/auth/me') {
    if (ROLE === 'admin') return ok({ user: { profileId: OWNER.id, email: '', fullName: OWNER.full_name, role: 'admin', accountStatus: 'active', mustChangePassword: false }, profile: { id: OWNER.id, full_name: OWNER.full_name }, permissions: ['*'] });
    if (ROLE === 'tenant') return ok(tenant.me);
    return new Response(JSON.stringify({ error: { code: 'UNAUTHENTICATED', message: 'Not signed in' } }), { status: 401, headers: { 'Content-Type': 'application/json' } });
  }
  for (const [m, pattern, handler] of ROUTES) {
    if (m === method && pattern.test(path)) return handler();
  }
  // Nothing is written anywhere. An unlisted call fails loudly instead of
  // reaching a real server, and the capture script reports it.
  console.warn('[harness] unmocked', method, path);
  window.__unmocked = (window.__unmocked || []).concat(`${method} ${path}`);
  return new Response(JSON.stringify({ error: { code: 'HARNESS_UNMOCKED', message: 'Not mocked: ' + path } }), { status: 501, headers: { 'Content-Type': 'application/json' } });
};

// The viewing invitation that greets a first visit would cover the page being filmed.
try { localStorage.setItem('hivelet.viewingPromptDismissed', '1'); } catch {}

history.replaceState(null, '', TARGET);
const apiModule = await import('/src/lib/api.ts');
if (ROLE !== 'public') apiModule.setStoredToken('sample-session');
await import('/src/main.ts');
const router = (await import('/src/router/index.ts')).default;
await router.isReady();
await router.push(TARGET);
window.__harnessReady = true;
</script>
